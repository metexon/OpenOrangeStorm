
#############################################################################
# Filament Extruder configuration for Elegoo Orangestorm Giga
#############################################################################


#############################################################################
#   Extruder Config
#############################################################################

[extruder]
step_pin:mcu1:gpio5
dir_pin:mcu1:gpio4
enable_pin:!mcu1:gpio10
microsteps:16
rotation_distance: 31.4	#Bondtech 5mm Drive Gears
gear_ratio: 52:10
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 1.000
filament_diameter: 1.750
min_temp: 0
max_temp: 330
heater_pin:mcu1:gpio0
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin: mcu1:gpio26
max_power: 1
pressure_advance: 0.032
pressure_advance_smooth_time: 0.02
max_extrude_cross_section:500
instantaneous_corner_velocity: 2.5
max_extrude_only_distance: 300
max_extrude_only_velocity:60
max_extrude_only_accel:2000
step_pulse_duration:0.000002 
min_extrude_temp:0
control: pid
pid_kp: 26.213 
pid_ki: 1.304
pid_kd: 131.721 



[verify_heater extruder]
max_error: 30
check_gain_time:10
hysteresis: 10
heating_gain: 2


#############################################################################
#   TMC Config
#############################################################################


[tmc2209 extruder]
uart_pin: mcu1:gpio6
interpolate: true
run_current: 0.8
hold_current: 0.2
sense_resistor: 0.110
stealthchop_threshold: 0


#############################################################################
#   Probe Config
#############################################################################

[probe]
pin:^mcu1:gpio11
x_offset: -14.0
y_offset: -29.5
z_offset: 0.0
speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries:4


#############################################################################
#   Fan Config
#############################################################################

[heater_fan heater1fan]
pin:mcu1:gpio3
shutdown_speed: 1
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[output_pin fan1]
pin:mcu1:gpio1
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0
scale: 255
shutdown_value: 0.0


#############################################################################
#   LED Config
#############################################################################

[output_pin caselight]
pin:mcu1:gpio25
pwm: false
shutdown_value:0
value:0.0


#############################################################################
#  Elegoo Extra Macros 
#############################################################################

[gcode_macro M106]
#rename_existing:M106.1
gcode:
    {% if params.P is defined %}
      {% if params.S is defined %}
        SET_PIN PIN=fan{params.P|int} VALUE={params.S|int}
      {% else %}
        SET_PIN PIN=fan{params.P|int} VALUE=255
      {% endif %}
    {% else %}
      {% if params.S is defined %}
        SET_PIN PIN=fan1 VALUE={params.S|int}
      {% else %}
        SET_PIN PIN=fan1 VALUE=255 
      {% endif %}
    {% endif %}

[gcode_macro M107]
#rename_existing:M107.1
gcode:
    {% if params.P is defined %}
      {% if params.S is defined %}
        SET_PIN PIN=fan{params.P|int} VALUE={params.S|int}
      {% else %}
        SET_PIN PIN=fan{params.P|int} VALUE=0
      {% endif %}
    {% else %}
      {% if params.S is defined %}
        SET_PIN PIN=fan1 VALUE={params.S|int}
      {% else %}
        SET_PIN PIN=fan1 VALUE=0
      {% endif %}
    {% endif %}

[gcode_macro m104]
rename_existing: M104.6245197
gcode:
  {% set TARGET = params.S | float %}
  {% if "T" in params %}
    {% set extruder = "extruder" ~ params.T|replace('0', '')
      if "T" in params else printer.toolhead.extruder %}
      SET_HEATER_TEMPERATURE HEATER="{extruder}" TARGET={TARGET} 
  {% else %}
      SET_HEATER_TEMPERATURE HEATER=extruder  TARGET={TARGET} 
  {% endif %}

[gcode_macro m109]
rename_existing: M109.6245197
gcode:
  {% set TARGET = params.S | float %}
  {% if "T" in params %}
    {% set extruder = "extruder" ~ params.T|replace('0', '')
      if "T" in params else printer.toolhead.extruder %}
      SET_HEATER_TEMPERATURE HEATER="{extruder}" TARGET={TARGET} 
      TEMPERATURE_WAIT SENSOR="{extruder}" MINIMUM={TARGET-5} MAXIMUM={TARGET+50}   
  {% else %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={TARGET} 
        TEMPERATURE_WAIT SENSOR=extruder  MINIMUM={TARGET-5} MAXIMUM={TARGET+50}
  {% endif %}
  